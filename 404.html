      "chapterImageAlts": {"cadImageLabel": "First SolidWorks model of the stapler remover, labeling the top lever, bottom lever, spring and pin", "cadImage2": "Second CAD iteration with level prongs, barrel screws and a 45-degree torsion spring", "analysisImageLabel": "Design of experiments ranges for insert width, sheet-metal thickness, handle length and pivot distance", "pocImage": "Early white 3D-printed proof-of-concept prototype with a hinged lever, prongs and a base plate", "cadDemo1": "3D-printed Iteration 2 with level prongs and a torsion spring", "cadDemo2": "3D-printed Iteration 2 lined up under a staple", "tolImage1": "Torsion spring fit drawing with tolerances", "tolImage2": "Sheet metal fit tolerance drawing", "feaImage": "Factor of safety plot of the optimized top lever, with the lowest safety factor at the tip", "finalImageLabel": "CAD of the final stapler remover design with no spring and no barrel screws", "valImage1": "Stress map of the lower web under a 25 N grip load", "valImage2": "Pivot slip fit with minimum diametral clearance of 0.03 mm", "valImage3": "Center tongue alignment with a worst-case centered side gap of 0.68 mm", "dieImageLabel": "Animation of one workpiece moving through the eight stations of the progressive die for the bottom lever", "dieStations": "Overview of all eight progressive die stations, each showing the upper tool, the sheet after that station and the lower die", "conceptGif": "Animation of the staple lift concept in three steps: insert, squeeze and extract", "v9Image": "ANSYS von Mises stress contour of the V8 levers at peak extraction, with the plate-hole edge at 299 MPa as the design-critical spot"},
      "removedImages": ["conceptImageLabel"],
      "conceptSteps": [{"h": "", "noText": true, "img": "/img/44907b4097e0.webp", "alt": "Concept generation chart listing potential solutions for each sub-function and the three variants built from them", "img2": "/img/9bed3c976bfb.webp", "alt2": "Decision matrix scoring the three variants against the original remover"}],
      "originalImage2Alt": "A wand-style staple remover with a single slim black handle and a small tip",
      "original": "This is the standard jaw-style remover we started from. A few things bother me about it:\n• It pinches the staple instead of lifting it, so it can bend or snap the staple and tear the paper.\n• It's awkward to hold. You have to squeeze the jaws shut with your fingertips, and that's hard to do with one hand.",
      "cadImageLabel": "ADD CAD RENDER + EXPLODED VIEW HERE",
      "analysisImageLabel": "ADD DOE / MONTE CARLO / FEA RESULT HERE",
      "manufacturingImageLabel": "ADD SHEET-METAL DRAWING + FORMING STAGES HERE",
      "prototypeImageLabel": "ADD PROTOTYPE PHOTO HERE (100:1 scale model)",
      "testingImageLabel": "ADD TESTING PHOTO HERE",
      "finalImageLabel": "ADD FINAL PRODUCT PHOTO HERE",
      "galleryLabels": "House of Quality\nTargets from the House of Quality\nFAST diagram\nValue analysis",
      "galleryImages": ["/img/3d19a75fb555.webp", "/img/5114d0e5d04c.webp", "/img/a181c90d00ab.webp", "/img/7114a248c661.webp"],
      "objectives": "• Pull a standard staple out in one motion without snapping it.\n• Keep the grip force at 25 N or less.\n• Make every metal part by stamping and forming flat sheet.\n• Keep tolerances that still assemble with real production variation.\n• Take the staple out without tearing the paper.",
      "concept": "We started with what people want: easy to use and no ripped paper. Then we asked 10 people, including our professor, to rank their top three ideas for each sub-function. Their picks became Variant 1, which also won our decision matrix, and we built our first CAD around it.",
      "conceptVideo": "Here's how it works. The tapered fork and center tongue slide under the staple. Squeezing lifts the center while the outer forks support the crown. Then the legs rotate outward and clear the paper as the tool pulls away. This is a schematic, not FEA.",
      "cad": "Iteration 1: our first CAD, built around the top-voted ideas (top lever, bottom lever, spring and pin). We found the middle prong couldn't grab the staple, since we assumed all three prongs would slide under it together.",
      "cadAfter": "Iteration 2: we leveled all three prongs so they slide under the staple together. We mounted the levers with barrel screws and switched to a 45-degree torsion spring. Then we 3D printed it and tried it on real staples.",
      "cadPoc": "Proof of concept: early on, before refining the CAD, we 3D printed a rough prototype to check that the idea works, a hinged lever pushing prongs under the staple.",
      "analysisSplit": true,
      "analysis": "Trial 17 came out best: insert width 9.5 mm, sheet thickness 1.2 mm, handle length 55 mm, pivot distance 16 mm. It had the lowest robust score, so the best balance between hitting 25 N and keeping variability low.",
      "analysisTol": "The tolerance stack-up analysis confirms that the spring assembly maintains a positive clearance under worst-case conditions.",
      "analysisFEA": "FEA of the optimized top lever, under the same 15 N load as the first design, showed the maximum von Mises stress dropped to about 2.74 ksi. The yield factor of safety is 21.3 and the ultimate is about 25, so the lever is no longer near its material limits. The stress at the tip, the critical failure mode from our FMEA, is much lower.",
      "materials": "I chose [material — e.g., 1095 spring steel / 301 stainless, X mm thick] because the lever has to flex slightly and return without permanent set, resist wear at the staple contact edge, and still form cleanly without cracking at the bends.\n\nAll metal parts are designed for a progressive die: pierce the pivot and locating holes, notch the outline, form the bends, and cut off — so each tool stroke produces a finished part. Bend radii were kept at or above [X]× material thickness to avoid cracking.",
      "prototyping": "I built a 100:1 scale model to check proportions and how the hand wraps around the lever before committing to fine details. [Add: any 3D-printed or hand-formed prototypes, what each one was meant to answer, and what you learned from holding and using it.]",
      "testing": "Validation combined analysis with physical checks:\n• FEA confirmed stress in the formed lever stays below yield at the maximum expected grip load.\n• Monte Carlo and tolerance results confirmed the design still works under production variation.\n• [Add any physical test — e.g., removing X staples from Y sheets and recording clean removals vs. snapped staples.]",
      "failures": "[Describe a real setback — for example: an early lever geometry concentrated stress at the inside of a bend; FEA flagged it and I increased the bend radius and added relief.]\n\n[Describe a manufacturability issue — for example: a hole placed too close to a bend line would distort during forming, so I moved it at least X× thickness away.]\n\nEach change traded a little design freedom for a part that is easier and cheaper to make reliably.",
      "finalDesign": "V8, the final design, was made with ChatGPT 6 (Astra model) and Claude. I gave them full context plus my own thinking, and the design came back with no spring and no barrel screws. The lever resets by hand, and a hard stop on the bottom lever limits how far it bends. It took 8 rounds of iteration and simulation (DOE, tolerance, FEA).",
      "finalAI": "I checked every CAD by hand and asked the AI why whenever it changed something. It sped up the design, but I still had to use my own judgment to catch what needed checking.",
      "analysisIntro": "I ran the analysis below on the final design (V8).",
      "materialFact": "",
      "v9Story": "I ran V8 through ANSYS with a 25,000-cycle fatigue check. The model uses the real CAD, 1.0 mm steel sheet and a 15 N staple pull, the top of the typical range.\n\nResult: a marginal pass.",
      "v9Lessons": "What I found:\n• The weak spot is the lifter plate, at the hole edge and the sharp bend corners, not the hard stops.\n• The design carries about 16 N before it drops under 25,000 cycles (estimate), so there's almost no margin at 15 N.\n• Sharp corners in the CAD are the open risk. The real stamped corner radius decides if it's safe.\n\nFor V9 I'll add a radius of at least 0.5 mm to the six bend corners and move the hole out of the neck.",
      "dieStory": "For the bottom lever, I had ChatGPT design and test a progressive die as if we were really going to make it, so I could learn how a sheet-metal part gets made. The animation follows one part through eight stations: pierce, cut, trim, bend, final cutoff. It only shows motion. Forces and springback aren't simulated.",
      "dieDemo": "I also 3D printed a demo model of the die. The strip moves one station per stroke, each station does one job, and the carrier strip holds the part until the last cut.",
      "results": "• Part count: [X] → [X] ([X]% reduction)\n• Predicted grip force: [X] N → [X] N\n• Estimated unit cost: [$X] → [$X] at [X] units/year\n• Monte Carlo yield against the force spec: [X]%\n• FEA safety factor at max load: [X]",
      "lessons": "This project taught me that designing a part and designing how it gets made are the same job. Once we committed to stamping, every choice had to work for the press, not just the CAD: bend radii, hole spacing, even the order of the die stations. I also learned to let the numbers lead. The DOE showed us which dimensions actually mattered, and the tolerance stack-ups caught fit problems before anything was cut.\nWhat's next? If I had the resources, I'd take it all the way to production:\n• Send the drawings and die layout to a stamping vendor for a quote and a manufacturability review.\n• Run a short batch on soft tooling and test it with real people and real staples.\n• Lock the design, build the hardened progressive die, and scale up."

      "slug": "finderbot",
      "title": "FinderBot",
      "oneLiner": "A small rover that drives around a room and uses an AI camera to find lost items.",
      "primaryCategory": "Product Design",
      "categories": "Product Design, Mechanical Systems, Manufacturing and DFM",
      "summary": "My friends are always losing stuff in their rooms. Water bottles, AirPods, keys, you name it. So in Spring 2026 I thought: what if a little rover could just go find it? That's FinderBot. It drives around, looks with an AI camera, and finds the item. I also wanted to treat the shell like a real product, so I designed it for injection molding.",
      "tools": "SolidWorks, SolidWorks Plastics, Python, Claude",
      "manufacturingMethod": "Injection-molded ABS/PC enclosure, 3D-printed prototype",
      "heroImageLabel": "FinderBot render",
      "heroImage": "/img/9f502c713597.webp",
      "heroImageAlt": "Render of FinderBot, a small white rover with a yellow camera mount on two servos",
      "galleryLabels": "",
      "fbReqIntro": "What it had to do:",
      "fbReq": "Before designing anything, I wrote down what it actually had to do:\n• See: an AI camera on two servos so it can look around.\n• Move: DC motors to drive.\n• Not crash: ultrasonic sensors to spot obstacles.\n• Think: one microcontroller running everything.\n• Look like a product: an injection-molded enclosure. I really wanted to learn how plastic parts get made.",
      "fbWiring": "I didn't want to design a shell around parts that might not work, so I wired everything up on my desk first and tested each part and connection on its own. Claude helped me write the code. Then came the cardboard mock-up, the cheapest way to figure out how it all fits together.",
      "fbEncl": "For the enclosure, I worked with Claude Fable 5.2. I gave it the injection-molding basics and made it stick to the rules for draft, ribs, bosses and wall thickness. It started as a plain box, and every round got it closer to something you could actually mold.",
      "fbRibs": "The ribs (arrows) keep the thin walls from flexing, and the bosses (circled) give the screws something solid to bite into.",
      "fbDraft": "I kept the walls at 2.4 mm with 1.5° of draft so the part slides out of the mold instead of sticking. The draft analysis is my check that every face actually has it.",
      "fbFlow": "Next question: will the mold even fill? I simulated it in ABS/PC. It fills at about 38 MPa (5,542 psi), under 66% of the machine's max pressure, so there's room to spare.",
      "fbWeld": "It also showed weld lines, where two flow fronts meet and the plastic can be weaker. Those can be fixed in the tooling by adding vents. Then I 3D printed it to check the design in my hands.",
      "fbFinal": "Honestly, I ran out of time this semester to get all the wiring inside the enclosure. But the open build worked, and in our demo FinderBot found the items. That was the whole point.",
      "fbLearn": "FinderBot pushed me out of my comfort zone. Nobody handed me a spec. I came up with the product, decided what it had to do, and designed it from scratch. It also taught me how most of the stuff around us gets made. Phone cases, remotes, car interiors: a lot of it is injection-molded plastic, and now I know why those parts look the way they do:\n• Keep walls uniform. Thick spots cool slower, shrink more and leave sink marks, so I held mine at 2.4 mm.\n• Draft isn't optional. Without it, the part drags and sticks coming out of the mold.\n• Ribs and bosses keep thin walls stiff and give screws something to hold, without adding thickness.\n• Simulate the fill first. Mold flow is where you catch weld lines and short shots, before anyone pays to cut a steel mold.",
      "fbSketch": "Before CAD, I sketched a few forms it could take: a rover, a stationary tower, a desk one and a clip-on. The rover won. A camera that can drive itself around covers a whole room, and that's the whole point of finding lost stuff.",

      "order": 6,
      "slug": "coldplate",
      "title": "Battery Pack Cold Plate",
      "oneLiner": "A quick-release latch that holds a pre-cooling plate under our Formula SAE car's battery pack.",
      "primaryCategory": "Mechanical Systems",
      "categories": "Mechanical Systems, Engineering Analysis, Manufacturing and DFM",
      "summary": "Before I joined Formula Spartan Racing in summer 2024, I watched every F1 highlight until I knew every driver on the grid. I joined because I wanted to see how a real engineering team works. Honestly, I also wanted to drive the car. It was my first time building a race car from scratch, and I wanted to help the team any way I could. On our SR-16 car, my job was the cold plate mount. The cold plate pre-cools the battery pack before endurance, then comes off before the race, so how it attaches really matters.",
      "tools": "SolidWorks, MATLAB, ANSYS Thermal, FEA, GD&T",
      "manufacturingMethod": "Sheet metal, lathe",
      "heroImageLabel": "Cold plate render",
      "heroImage": "/img/5b3c08e00d20.webp",
      "heroImageAlt": "Render of the cold plate with copper coolant tubes and two T-handle latches",
      "galleryLabels": "",
      "cpProblem": "The old cold plate was held on by magnets. That meant a weak hold and poor contact with the battery pack, and poor contact means poor cooling.",
      "cpReq": "Here's what I had to work around:\n• It has to come off fast and easily.\n• It can't get in the way of the aero.\n• It has to work with the chassis and the battery pack team's designs.\n• It can't fall off. Ever.",
      "cpConcept": "I sketched two ways to mount it, from the front and from the side. The idea I went with is a twist latch: turn the T-handle and it locks the plate onto a sheet-metal hinge on the chassis. Quick on, quick off.",
      "cpProto": "Before cutting any metal, I 3D printed the parts and test fit them on the chassis. It's a cheap way to find problems early.",
      "cpFea1": "Two questions here: will the hinge hold, and will the rubber latch stretch back? I loaded it with 22 N, half the cold plate's weight. The hinge only deflects 0.13 mm and stays elastic, with a factor of safety of 6.3.",
      "cpFea2": "The bolts were what I worried about most. They peak at 56.1 MPa, which still gives a factor of safety of 6.2.",
      "cpMfg": "Then test fitting turned up a problem: the hinge didn't leave enough clearance for the battery pack tooling. My fix was a spacer block that pushes the hinge outward. I ran FEA again to make sure it could still carry the weight. It only sees 0.16 MPa, a factor of safety over 300.",
      "cpMfg2": "I made drawings for both parts, then built them in our shop with sheet-metal tools and the lathe.",
      "cpFinal": "And here it is on the car.",
      "cpThermal": "I used ANSYS Thermal to set a baseline for what to test and validate. The animation below is an illustrative model, not ANSYS output, but it shows the idea: with pre-cooling, the modeled peak drops from 55.3 °C to 51.1 °C.",
      "cpResult": "So, did it work?\n• It's faster to put on and take off before endurance.\n• In field runs, the battery peaked at a lower temperature, and the car got more performance out of it.",
      "cpLearn": "This was my first real hands-on project, and I got to do it with an amazing team. Honestly, I came in way over my head, and I enjoyed every minute of catching up. I learned to run the sheet-metal tools and the lathe, to turn an FEA result into a part I could hold, and to design around other people's parts like the chassis and the battery pack. Those shop skills and that team habit are something I'm bringing into every project after this one.",

    {
      "order": 4,
      "slug": "antenna",
      "title": "Robotic Rover Antenna Mast",
      "oneLiner": "A light carbon fiber mast that packs into our rover and goes up to about 9 ft so the radios keep their link.",
      "primaryCategory": "Mechanical Systems",
      "categories": "Mechanical Systems, Engineering Analysis, Testing and Validation",
      "summary": "In Spring 2026 I joined SJSU Robotics knowing pretty much nothing about antennas. Honestly, that's why I picked this project. The rover needed a mast that fits in its small size box: the carbon fiber pole collapses to about 1.3 ft and extends to 9 ft, so our radios can reach the base station from as high as possible. Along the way I had to learn how signals and comms actually work.",
      "tools": "SolidWorks, Onshape, MATLAB, ANSYS, Prototyping",
      "manufacturingMethod": "3D-printed PLA mounts, carbon fiber pole",
      "heroImageLabel": "Antenna mast render",
      "heroImage": "/img/59551f4a1f7d.webp",
      "heroImageAlt": "Render of two mast setups: a Ubiquiti Rocket on one carbon fiber pole, and two white pole antennas on a crossbar",
      "galleryLabels": "",
      "amProblem": "The team already had two antennas: an HW 0D9-5 FN pole antenna and a Ubiquiti Rocket M900 base station. What they didn't have was a good way to get them up high. And height matters a lot for radio. The higher the antenna, the less stuff gets in the way of the signal.",
      "amReq": "So here's what the mast had to do:\n• Fit inside the rover's 1.5 m × 1.5 m size limit.\n• Go up to about 9 ft.\n• Stay light and hold up to vibration while the rover drives.\n• Mount cleanly and be easy to service.",
      "amConcept": "I started by looking at how other things pack big into small, like origami folds and satellite solar arrays that unfold in space. I also read up on signal basics and how mast height changes the link. Then I sketched a few ways to attach it and worked out the heights in my notebook. The pole itself collapses to about 1.3 ft, and with the mount and antenna on top the whole stack is about 2.4 ft stowed, versus 9 ft fully up.",
      "amMatrix": "To actually pick, I used decision matrices. Mounting the mast on its own, separate from everything else on the rover, scored highest. For the pole, automatic and manual literally tied, so I went manual: simpler, lighter, and one less thing to break. For material, carbon fiber beat aluminum and steel because it's stiff and light.",
      "amCad": "I measured the carbon fiber pole, the antenna pole and the Rocket so every part would really fit together. The mount comes apart completely, so it's easy to service. The top is modular too, so you can swap between the dual antenna crossbar and the Rocket. Telephone wire loops keep everything secured.",
      "amProto": "Then I printed everything in PLA and test fit it on the rover. One thing I learned fast: one point of contact isn't enough. With a single clamp, the pole can slip or rock, so it gets two.",
      "amLink": "Next question: can it hold a 1 km link? I built a MATLAB model at 915 MHz that sweeps mast height from 1.3 to 9 ft for both setups. At 9 ft with a clear path, there's about 18 to 20 dB of margin over the −90 dBm threshold. With moderate obstruction, it still makes it with 3 to 5 dB to spare. If a building fully blocks it, neither setup closes the link. It's a scenario model, not field data, but it showed me height really pays off.",
      "amVib": "Last check was vibration. In ANSYS, I compared one mount against two mounts 7 in apart, with a 3 N side load at the tip. Two mounts cut the max deflection from 110.7 mm to 48.3 mm, about 56% less, and raised the natural frequency by about 56%. That backed up the two-clamp design.",
      "amFinal": "Here are both setups on the rover. I didn't fully finish this semester. Next up is routing the wiring so it extends and collapses with the mast and stores neatly.",

<script>

  const ph = (label, ratio, src, alt, slot) => {

    return `<div class="${ratio} slot"><div class="slotin">${inner}</div><div class="slotbar"><button type="button" data-rep="${slot}">${src ? 'Replace image' : 'Add image'}</button>${src ? `<button type="button" data-clr="${slot}">Remove</button>` : ''}</div></div>`;
  };

  // ---- Edits made in the page itself are stored in the artifact database and laid over the built-in content ----
  const OV = { text: {"stapler__analysisFEA": "FEA of the optimized top lever, under the same 25 N load as the second iteration. The yield factor of safety is 21.3 and the ultimate is about 25, so the lever is no longer near its material limits. The stress at the tip, the critical failure mode from our FMEA, is much lower.", "stapler__finalAI": "I checked every CAD by hand and asked the AI why whenever it changed something. It sped up the design, but I still had to use my own judgment to catch what needed checking.", "stapler__finalDesign": "V8, the final design, was made with ChatGPT 6 (Astra model) and Claude. I gave them full context plus my own thinking, and the design came back with no spring and no barrel screws. The lever resets by hand, and a hard stop on the bottom lever limits how far it bends. It took 8 rounds of iteration and simulation (DOE, tolerance, FEA).", "stapler__summary": "Office Stapler Remover Redesign was a Design for Manufacturing project done in Spring 2026. My teammate and I redesigned an existing office stapler remover and optimized it for manufacturing. To highlight the work I did for this project, most of this page details my contributions."}, img: {} };
  const U = slug => slug === 'stapler' ? 'staple' : slug;
  let editMode = false;
  const baked = (p, f) => /^cs\d+$/.test(f) ? ((p.conceptSteps || [])[+f.slice(2)] || {}).text : p[f];
  const getT = (p, f) => { const k = p.slug + '__' + f; return k in OV.text ? OV.text[k] : baked(p, f); };
  const imgSrc = (p, slot, baked) => { const k = p.slug + '__' + slot; if (k in OV.img) return OV.img[k] ? '/_blob/' + OV.img[k] : undefined; return baked; };
  const ed = (p, f, cls) => `<div class="ed ${cls || ''}" contenteditable="plaintext-only" spellcheck="true" data-k="${p.slug}__${f}" data-ph="Click to write…">${esc(getT(p, f))}</div>`;
  const short = l => l.split(' — ')[0];
  // Plain text -> paragraphs and arrow lists; [bracketed] placeholders are highlighted so they are easy to find.
  const rich = (t) => {
    const mark = x => esc(x).replace(/\[[^\]]*\]/g, m => `<mark class="todo">${m}</mark>`);
    const out = []; let list = [], para = [];
    const flushP = () => { if (para.length) { out.push(`<p>${para.map(mark).join('<br>')}</p>`); para = []; } };
    const flushL = () => { if (list.length) { out.push(`<ul class="arrows">${list.map(i => `<li>${mark(i)}</li>`).join('')}</ul>`); list = []; } };
    String(t || '').split('\n').forEach(line => {
      const l = line.trim();
      if (!l) { flushP(); flushL(); }
      else if (l.startsWith('• ')) { flushP(); list.push(l.slice(2)); }
      else { flushL(); para.push(l); }
    });
    flushP(); flushL();
    return out.join('');
  };

  const views = {
    home() {

        <section class="intro">

    project(slug) {

      const T = f => getT(p, f);

      const chapters = [

      const facts = [['Role', 'roleFact'], ['Tools', 'tools'], ['Manufacturing', 'manufacturingMethod'], ['Material', 'materialFact']].filter(([, f]) => editMode || has(f));
      const media = (f, img) => {

      const stepsHtml = (p.conceptSteps || []).map((st, n) => `

                <div class="media wide zoom${st.img2 ? ' two' : ''}">${ph(st.h, 'rauto', imgSrc(p, 'cs' + n + 'img', st.img), st.alt, editMode ? p.slug + '__cs' + n + 'img' : null)}${st.img2 ? ph(st.h, 'rauto', imgSrc(p, 'cs' + n + 'img2', st.img2), st.alt2, editMode ? p.slug + '__cs' + n + 'img2' : null) : ''}</div>
              </div>`).join('');
      const cadExtra = (() => {
        const ci = (k) => (p.chapterImages || {})[k];
        const one = (k, lab) => { const src = imgSrc(p, k, ci(k)); return (src || editMode) ? `<div class="media${k === 'pocImage' ? ' wide' : ''} zoom${(p.chapterImagesClear || []).includes(k) && !(p.slug + '__' + k in OV.img) ? ' clear' : ''}">${slot(k, lab, src ? 'rauto' : 'r169', ci(k), (p.chapterImageAlts || {})[k])}</div>` : ''; };
        const duo = (ks, lab) => { const any = ks.some(k => imgSrc(p, k, ci(k))); return (any || editMode) ? `<div class="media wide two zoom">${ks.map(k => slot(k, lab, imgSrc(p, k, ci(k)) ? 'rauto' : 'r169', ci(k), (p.chapterImageAlts || {})[k])).join('')}</div>` : ''; };

        return t('cadAfter') + one('cadImage2', 'Iteration 2 CAD') + t('cadDemo') + duo(['cadDemo1', 'cadDemo2'], 'Iteration 2 print') + t('cadPoc') + one('pocImage', 'Proof of concept') + (p.analysisSplit ? '' : t('cadAfter2'));

      const analysisHtml = (() => {
        const ci = (k) => (p.chapterImages || {})[k];

              ${f === 'concept' ? stepsHtml + (p.compact ? conceptExtra : '') : ''}
              ${media(f, img)}
              ${f === 'cad' ? cadExtra : ''}${f === 'finalDesign' && p.compact ? finalExtra : ''}`}
            </section>`).join('');
      const labels = (p.galleryLabels || '').split('\n');
      return `
      <article class="wrap">
        <a class="back" href="/">← All projects</a>
        <div class="cs-hero"${p.heroW ? ` style="max-width:${p.heroW}px;margin-left:auto;margin-right:auto"` : ''}>${slot('hero', p.heroImageLabel, 'r219', p.heroImage, p.heroImageAlt)}</div>
        <section class="cs-intro">
          <h1 tabindex="-1">${editMode ? ed(p, 'title', 'one') : esc(T('title'))}</h1>
          ${has('ndaNote') ? `<p class="nda">${esc(T('ndaNote'))}</p>` : ''}
          <dl class="facts">${facts.map(([k, f]) => `<div><dt>${k}</dt><dd>${editMode ? ed(p, f, 'one') : esc(T(f))}</dd></div>`).join('')}</dl>
          ${editMode ? ed(p, 'summary', 'note') : `<p class="note">${esc(T('summary'))}</p>`}
        </section>
        <div class="chapters">${chaptersHtml}</div>
        ${(editMode || labels.some(Boolean)) ? `<section id="gallery">
          <h2 class="gallery-title">Gallery</h2>
          <div class="gallery zoom">${labels.map((l, n) => slot('gallery' + n, l, 'r43', (p.galleryImages || [])[n] || undefined, l)).join('')}</div>
        </section>` : ''}
        <nav class="pn" aria-label="More projects">
          <a href="/${U(prev.slug)}"><small>Previous</small><span>${esc(getT(prev, 'title'))}</span></a>
          <a href="/${U(next.slug)}"><small>Next</small><span>${esc(getT(next, 'title'))}</span></a>
        </nav>
      </article>`;
    },

    about() {
      return `
      <div class="wrap">
        <section class="intro"><h1 tabindex="-1">About</h1></section>
        <section class="about">
          ${ph('Vincent Vu', 'r45', S.aboutPhoto, 'Vincent Vu at Yosemite')}
          <div>
            <p>${esc(S.about)}</p>
            <p>${esc(S.freeTime)}</p>
            <p>Reach out if you’d like to learn more!</p>
            <div style="margin-top:40px; display:flex; flex-wrap:wrap; gap:16px 28px; align-items:center">
              <a class="tlink" href="${esc(S.resumeUrl)}" target="_blank" rel="noopener" style="font-size:14px">resume</a>
              <a class="tlink" href="mailto:${esc(S.email)}" style="font-size:14px">${esc(S.email)}</a>
              <a class="tlink" href="${esc(S.linkedin)}" target="_blank" rel="noopener" style="font-size:14px">LinkedIn</a>
            </div>
          </div>
        </section>
      </div>`;
    },

    notFound() {
      return `<div class="wrap"><section class="intro"><h1 tabindex="-1">Page not found</h1><p class="note"><a class="tlink" href="/">Back to home</a></p></section></div>`;
    }
  };

  // Navigation works even where the page can't change its URL (sandboxed viewers,
  // data: URLs): clicks are handled here and the URL is updated only when allowed.
  const pathFromHash = () => (location.pathname.replace(/\/+$/, '') || '/');
  function go(path) {
    route(path);
    try { if (pathFromHash() !== path) history.pushState(null, '', path); } catch (e) { /* URL can't change here — page still updates */ }
  }
  document.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest('a[href^="/"]:not([target])');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute('href'));
  });

  function route(path, keep) {
    if (typeof path !== 'string') path = pathFromHash();
    const parts = path.split('?')[0].split('/').filter(Boolean).map(x => x.toLowerCase()).map(x => x === 'staple' ? 'stapler' : x);
    let html, nav;
    if (!parts.length) { html = views.home(); nav = 'home'; }
    else if (parts.length === 1 && P.some(p => p.slug === parts[0])) { html = views.project(parts[0]); nav = 'home'; }
    else if (parts[0] === 'about') { html = views.about(); nav = 'about'; }
    else html = views.notFound();

    main.classList.remove('enter'); void main.offsetWidth;
    main.innerHTML = html; if (!keep) main.classList.add('enter');
    document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const h1 = main.querySelector('h1');
    document.title = nav === 'home' && !parts.length ? 'Vincent Vu — Mechanical Engineer' : (h1 ? h1.textContent + ' — Vincent Vu' : 'Vincent Vu');
    if (!keep) window.scrollTo(0, 0);
    if (h1 && route.ran && !keep) h1.focus({ preventScroll: true });
    route.ran = true;
  }

  document.getElementById('fEmail').href = 'mailto:' + S.email;
  document.getElementById('fLinkedIn').href = S.linkedin;
  window.addEventListener('popstate', () => route());
  route();

  // ======== In-page editing (owner / editors only) ========
  const refresh = () => { const y = window.scrollY; route(undefined, true); window.scrollTo(0, y); };
  let dbDoc = null, assetsNs = null, chain = Promise.resolve();
  const bar = document.createElement('div');
  bar.id = 'editbar'; bar.hidden = true;
  bar.innerHTML = '<span id="editstate" aria-live="polite"></span><span id="edithint">Click any text to change it. Start a line with “• ” for a bullet.</span><button type="button" id="editbtn">Edit page</button>';
  document.body.appendChild(bar);
  const stateEl = bar.querySelector('#editstate'), btn = bar.querySelector('#editbtn');
  const say = (t, bad) => { stateEl.textContent = t; stateEl.classList.toggle('bad', !!bad); };
  const persist = () => {
    say('Saving…');
    chain = chain.then(() => dbDoc.set({ text: OV.text, img: OV.img })).then(() => say('Saved ✓'), e => say('Couldn’t save — ' + ((e && e.message) || 'try again'), true));
  };
  const setMode = on => {
    editMode = on; document.body.classList.toggle('editing', on);
    btn.textContent = on ? 'Done' : 'Edit page'; say(''); refresh();
  };
  btn.addEventListener('click', () => setMode(!editMode));

  // text: save when a field loses focus
  main.addEventListener('focusout', e => {
    const el = e.target; if (!editMode || !el.classList || !el.classList.contains('ed')) return;
    const k = el.dataset.k, [slug, f] = k.split('__'), pr = P.find(x => x.slug === slug);
    const v = el.innerText.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
    if (v === String(getT(pr, f) ?? '')) return;
    OV.text[k] = v; persist();
  });
  main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('one')) { e.preventDefault(); e.target.blur(); } });

  // images: pick, shrink in the browser, upload, remember the id
  const shrink = file => new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const m = 1800, r = Math.min(1, m / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('image conversion failed')), 'image/jpeg', 0.88);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('that file isn’t an image the browser can read')); };
    im.src = u;
  });
  main.addEventListener('click', e => {
    const z = !editMode && e.target.closest('.zoom img.pic');
    if (z) {
      const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<img alt="">'; lb.firstChild.src = z.src; lb.firstChild.alt = z.alt;
      const close = () => { lb.remove(); document.removeEventListener('keydown', esc2); };
      const esc2 = ev => { if (ev.key === 'Escape') close(); };
      lb.addEventListener('click', close); document.addEventListener('keydown', esc2); document.body.appendChild(lb); return;
    }
    const rep = e.target.closest('[data-rep]'), clr = e.target.closest('[data-clr]');
    if (clr && editMode) { OV.img[clr.dataset.clr] = ''; persist(); refresh(); return; }
    if (!rep || !editMode || !assetsNs) return;
    const key = rep.dataset.rep, inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try { say('Uploading…'); const blob = await shrink(f); const r = await assetsNs.upload(blob, { type: 'image/jpeg' }); OV.img[key] = r.id; persist(); refresh(); }
      catch (err) { say('Couldn’t upload — ' + ((err && err.message) || 'try again'), true); }
    };
    inp.click();
  });

  // light up once the page can reach its storage; the page works the same without it
  (async () => {
    try {
      if (!window.claude || !claude.use) return;
      const db = await claude.use('db'); if (!db) return;
      dbDoc = db.doc('portfolio/edits');
      dbDoc.onSnapshot(snap => {
        if (editMode) return;
        const d = snap.exists ? snap.data() : {};
        const t = JSON.stringify([d.text || {}, d.img || {}]);
        if (t === JSON.stringify([OV.text, OV.img])) return;
        OV.text = { ...(d.text || {}) }; OV.img = { ...(d.img || {}) }; refresh();
      }, () => {});
      assetsNs = await claude.use('assets');
      if (assetsNs) bar.hidden = false;
    } catch (e) { /* no storage here: stay a plain page */ }
  })();
})();
</script>
</body>
</html>
